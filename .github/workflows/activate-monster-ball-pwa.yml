      - name: Save changes in main branch
        id: commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add export_presets.cfg pwa/monster-ball-icon-512.png
          if git diff --cached --quiet; then
            echo "changed=no" >> "$GITHUB_OUTPUT"
            echo "PWA already enabled"
          else
            git commit -m "Enable native Godot PWA for Monster Ball"
            git push origin HEAD:main
            echo "changed=yes" >> "$GITHUB_OUTPUT"
          fi

      - name: Start existing game build
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Requesting existing web build to deploy new PWA..."
          if ! gh workflow run "Build and Deploy Monster Ball Web" --ref main; then
            echo "::warning::Automatic dispatch failed. Open Actions > Build and Deploy Monster Ball Web > Run workflow (main) to deploy PWA."
          fi

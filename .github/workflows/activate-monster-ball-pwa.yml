name: Activate Monster Ball PWA

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  activate:
    name: Enable native Godot PWA
    runs-on: ubuntu-latest
    steps:
      - name: Download game sources
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Configure Web export + app icon
        shell: bash
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          import re, base64

          preset_file = Path('export_presets.cfg')
          if not preset_file.exists():
              raise SystemExit('Missing export_presets.cfg in repository root. No changes made. Please send its contents to Alex.')
          data = preset_file.read_text(encoding='utf-8')
          chunks = re.split(r'(?=^\[preset\.\d+(?:\.options)?\]\s*$)', data, flags=re.MULTILINE)
          web_num = None
          for chunk in chunks:
              match = re.match(r'^\[preset\.(\d+)\]\s*$', chunk, re.MULTILINE)
              if match and re.search(r'(?m)^platform="Web"\s*$', chunk):
                  web_num = match.group(1)
                  break
          if web_num is None:
              raise SystemExit('Existing Web export preset not found. No changes made. Send export_presets.cfg to Alex.')
          section_head = '[preset.' + web_num + '.options]'
          match = re.search(r'(?m)^' + re.escape(section_head) + r'\s*$', data)
          if not match:
              raise SystemExit('Cannot find '+section_head+' in export_presets.cfg. No changes made.')
          section_end = re.search(r'(?m)^\[preset\.\d+(?:\.options)?\]\s*$', data[match.end():])
          end = match.end() + section_end.start() if section_end else len(data)
          before, section, after = data[:match.end()], data[match.end():end], data[end:]
          values = {
              'progressive_web_app/enabled': 'true',
              'progressive_web_app/display': '1',  # Standalone (no browser address bar)
              'progressive_web_app/orientation': '2',  # Portrait mode, current game layout
              'progressive_web_app/icon_144x144': '"res://pwa/monster-ball-icon-512.png"',
              'progressive_web_app/icon_180x180': '"res://pwa/monster-ball-icon-512.png"',
              'progressive_web_app/icon_512x512': '"res://pwa/monster-ball-icon-512.png"',
              'progressive_web_app/background_color': 'Color(0.055, 0.035, 0.09, 1)',
          }
          for key, value in values.items():
              pattern = r'(?m)^' + re.escape(key) + r'=.*$'
              if re.search(pattern, section):
                  section = re.sub(pattern, lambda _: key + '=' + value, section)
              else:
                  section = section.rstrip('\n')+'\n'+key+'='+value+'\n'
          preset_file.write_text(before+section+after, encoding='utf-8')
          icon = Path('pwa/monster-ball-icon-512.png')
          icon.parent.mkdir(parents=True, exist_ok=True)
          icon_b64 = (
